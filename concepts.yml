# 判定：一个概念**首次出现**的地方，附近必须有指向它定义的指针。
#
# 为什么需要这条：书里的前向引用是正常的（读到一半提到后面的概念），
# 但如果第一次提到时不给指针，读者就卡住了 —— 而他不知道
# 这个词在哪一章被定义，也不知道该不该现在去查。
#
# 这条规则是在一次结构审查里长出来的：13 个核心概念，
# 只有 3 个在首次出现时给了指针。

