# 口吻规则。
#
# 这本书是「我」在说话，不是一份关于这本书的说明。
# 两类问题在写作中会反复冒出来，所以做成判定：
#
# 一、第三人称自指 —— 「作者」「本书」「这本书」。
#    书在第三人称说自己，读起来像论文摘要，不像人在讲。
#
# 二、答辩腔 —— 宣布自己诚实、预防性辩解、解释自己的写作选择。
#    「诚实地说」是宣布诚实，不是诚实；
#    「这不是打脸」是在回答一个没人问的问题。
#
# 这两类在一次口吻审查里被抓出 282 + 40 处。

forbidden:
  - pattern: "作者"
    why: "我在说话，用「我」"
    allow: []

  - pattern: "本书"
    why: "书不该在第三人称说自己。用「我」，或者直接去掉框架"
    allow: []

  - pattern: "诚实地说"
    why: "宣布诚实不是诚实。直接说那件事"
  - pattern: "诚实地补"
    why: "同上"
  - pattern: "一个诚实的"
    why: "同上"

  - pattern: "这不是打脸"
    why: "回答一个没人问的问题"
  - pattern: "这不是修辞"
    why: "同上"
  - pattern: "这不是客气话"
    why: "同上"
  - pattern: "值得提前堵住"
    why: "预防性辩解。直接讲那个误读"

  - pattern: "值得说明为什么"
    why: "答辩腔。直接说明"

  # 三、给书打日期的时间词。
  #
  # 这是书，不是博客。「最近一个月合并了 291 次」这种写法把文本
  # 钉在了写它的那一周上：读者五年后读到它，不知道「最近」是什么时候，
  # 也没法判断这个数还算不算数。
  #
  # 换成固定的取样窗口（「取样的那个月」「取样的五百次失败」），
  # 信息一点没少 —— 少的只是那个会过期的锚点。
  # 日历日期同理：08-01 / 08-17 换成第 1 天 / 第 17 天之后，
  # 真正有意义的间隔反而更清楚了。
  #
  # 注意这里禁的只是**相对于写作时刻**的说法。
  # 「翻你最近十次红灯」是给读者的动作，相对的是读者的此刻，不在此列 ——
  # 所以下面的模式都带了限定词，不是裸的「最近」。
  - pattern: "最近一个月"
    why: "给书打了日期。用固定的取样窗口，比如「取样的那个月」"
  - pattern: "最近半年"
    why: "同上"
  - pattern: "最近三十个"
    why: "同上。用「取样的三十个」"
  - pattern: "最近五百次"
    why: "同上。用「取样的五百次」"
  - pattern: "最近 500 次"
    why: "同上"
  - pattern: "这个月的"
    why: "同上。指的是哪个月？用「那个月」或写清窗口"
  - pattern: "上个月"
    why: "同上。用「不久前」或写清间隔"
  - pattern: "截至目前"
    why: "同上。截至哪一天？"
  - pattern: "写这本书的时候"
    why: "同上，而且是第三人称自指"

  # 讲自己写作结构的元评论：小节标题不该是「这一章为什么…」
  - pattern: "## 这一章为什么"
    why: "小节标题要讲内容，不讲写作选择"
  - pattern: "## 这一章的结构"
    why: "同上"
