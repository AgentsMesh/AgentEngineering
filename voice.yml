# 口吻规则。
#
# 这本书是「我」在说话，不是一份关于这本书的说明。
# 两类问题在写作中会反复冒出来，所以做成判定：
#
# 一、第三人称自指 —— 「作者」「本书」「这本书」。
#    书在第三人称说自己，读起来像论文摘要，不像人在讲。
#
# 二、答辩腔 —— 宣布自己诚实、预防性辩解、解释自己的写作选择。
#    「诚实地说」是宣布诚实，不是诚实；
#    「这不是打脸」是在回答一个没人问的问题。
#
# 这两类在一次口吻审查里被抓出 282 + 40 处。

forbidden:
  - pattern: "作者"
    why: "我在说话，用「我」"
    allow: []

  - pattern: "本书"
    why: "书不该在第三人称说自己。用「我」，或者直接去掉框架"
    allow: []

  - pattern: "诚实地说"
    why: "宣布诚实不是诚实。直接说那件事"
  - pattern: "诚实地补"
    why: "同上"
  - pattern: "一个诚实的"
    why: "同上"

  - pattern: "这不是打脸"
    why: "回答一个没人问的问题"
  - pattern: "这不是修辞"
    why: "同上"
  - pattern: "这不是客气话"
    why: "同上"
  - pattern: "值得提前堵住"
    why: "预防性辩解。直接讲那个误读"

  - pattern: "值得说明为什么"
    why: "答辩腔。直接说明"

  # 讲自己写作结构的元评论：小节标题不该是「这一章为什么…」
  - pattern: "## 这一章为什么"
    why: "小节标题要讲内容，不讲写作选择"
  - pattern: "## 这一章的结构"
    why: "同上"
